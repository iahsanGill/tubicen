global:
  resolve_timeout: 10s

route:
  receiver: on-call-webhook
  group_by: [alertname, service, rule_version]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: on-call-webhook
    webhook_configs:
      - url: http://checkout-1:8080/alerts
        send_resolved: true
