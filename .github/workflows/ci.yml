name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath ./cmd/tubicen

  policy-gate:
    name: Alert rule policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce repository alert policy
        uses: ./
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alert-rule-check
          path: dist/

  incident-demo:
    name: Missed on-call page incident
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Reproduce and prevent the incident
        run: ./demo/incident/run.sh
