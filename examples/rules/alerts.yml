groups:
  - name: checkout-slo
    interval: 1m
    rules:
      - alert: CheckoutErrorBudgetBurn
        expr: avg_over_time(checkout_error_ratio{service="checkout",environment="production"}[5m]) > 0.05
        for: 5m
        labels:
          severity: page
          team: payments
        annotations:
          summary: Checkout error ratio is above five percent

      - alert: CheckoutReplicaDown
        expr: min by (service) (up{service="checkout",environment="production"}) == 0
        for: 2m
        labels:
          severity: ticket
          team: payments
        annotations:
          summary: At least one checkout replica is unavailable
